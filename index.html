<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#343432">
  <meta name="description" content="네 가지 버튼 중 하나를 누르고 결과를 확인하는 확률 체험.">
  <title>어떤 버튼을 누르시겠습니까?</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">어떤 버튼을 누르시겠습니까?</h1>
    <div class="panel" aria-label="네 가지 금액 선택 버튼">
      <img class="panel-image" src="assets/panel.png" alt="" width="770" height="578" draggable="false">
      <span class="corner-patch" aria-hidden="true"></span>
      <button class="choice red" data-choice="0" aria-label="확률 100퍼센트, 1억원"><span class="sr-only">1억원</span></button>
      <button class="choice blue" data-choice="1" aria-label="확률 52퍼센트, 4억원"><span class="sr-only">52% 확률 · 4억원</span></button>
      <button class="choice yellow" data-choice="2" aria-label="확률 23퍼센트, 30억원"><span class="sr-only">23% 확률 · 30억원</span></button>
      <button class="choice white" data-choice="3" aria-label="확률 8퍼센트, 1조원"><span class="sr-only">8% 확률 · 1조원</span></button>
    </div>
    <p class="hint">버튼을 눌러 선택하세요<span>확률 체험용 · 실제 금전 지급 없음</span></p>
  </main>
  <dialog aria-labelledby="result-title" aria-describedby="result-description">
    <form method="dialog">
      <span class="result-tag" id="result-tag"></span>
      <h2 id="result-title"></h2>
      <p id="result-description"></p>
      <button class="again" autofocus>다시 선택하기</button>
    </form>
  </dialog>
</body>
</html>
