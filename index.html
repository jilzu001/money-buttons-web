<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#d6e3fa"><meta name="description" content="하루 한 번, 네 금액 버튼 중 하나를 선택하세요."><title>돈 버튼</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main class="compact">
<h1 class="sr-only">돈 버튼</h1><p class="hint">하루 한 번. 누르는 순간 선택은 끝.</p>
<div class="panel" aria-label="가상 보상 선택"><button class="choice yellow" data-choice="0"><span class="face"><strong>1억원</strong><span class="chance">100% 확률</span></span></button><button class="choice blue" data-choice="1"><span class="face"><strong>4억원</strong><span class="chance">52% 확률</span></span></button><button class="choice coral" data-choice="2"><span class="face"><strong>30억원</strong><span class="chance">23% 확률</span></span></button><button class="choice green" data-choice="3"><span class="face"><strong>1조원</strong><span class="chance">8% 확률</span></span></button></div>
<p id="daily-status" role="status" aria-live="polite"></p><button id="today-result" class="primary" hidden>오늘 결과 확인</button>
<p class="note">실제 금전 지급 없음</p>
</main>
<dialog id="learning-result" aria-labelledby="learning-title"><div class="learning-art" aria-hidden="true"></div><div class="learning-result-body"><span id="learning-tag" role="status" aria-live="polite"></span><h2 id="learning-title"></h2><p id="learning-description"></p><button id="result-ok" class="primary">확인</button></div></dialog>
</body></html>
