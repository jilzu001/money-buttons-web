<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d6e3fa">
  <meta name="description" content="네 가지 돈 버튼으로 즐기는 가벼운 확률 체험.">
  <title>돈 버튼</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">돈 버튼</h1>
    <div class="panel" aria-label="네 가지 금액 선택 버튼">
      <button class="choice yellow" data-choice="0" aria-label="확률 100퍼센트, 1억원"><span class="face"><strong>1억원</strong><span class="chance">100% 확률</span></span></button>
      <button class="choice blue" data-choice="1" aria-label="확률 52퍼센트, 4억원"><span class="face"><strong>4억원</strong><span class="chance">52% 확률</span></span></button>
      <button class="choice coral" data-choice="2" aria-label="확률 23퍼센트, 30억원"><span class="face"><strong>30억원</strong><span class="chance">23% 확률</span></span></button>
      <button class="choice green" data-choice="3" aria-label="확률 8퍼센트, 1조원"><span class="face"><strong>1조원</strong><span class="chance">8% 확률</span></span></button>
    </div>
    <p class="note">확률 체험용 · 실제 금전 지급 없음</p>
  </main>
  <dialog id="result" aria-labelledby="result-title" aria-describedby="result-description"><form method="dialog"><span id="result-tag"></span><h2 id="result-title"></h2><p id="result-description"></p><button class="again" autofocus>다시 선택하기</button></form></dialog>
</body>
</html>
